[project]
name = "example-monorepo"

[scan]
profile = "balanced"
target = "."
execution = "auto"
report_dir = "secweaver-reports"
parallelism = 4
excludes = [
  ".git",
  ".venv",
  "node_modules",
  "vendor",
  "generated",
  "third_party",
  "secweaver-reports",
]
sast_rule_paths = ["builtin:baseline"]
